version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

# Configuración para el backend (SSR/Express) en Amplify
# Nota: Amplify Hosting detectará automáticamente el script "start" de tu package.json
