version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

# Este archivo despliega solo artefactos estáticos de frontend desde dist.
# Amplify Hosting estático NO ejecuta server.ts (Express).
